[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-sentinel"
version = "0.1.0a0"
description = "A conservative watchdog for autonomous AI coding agents"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "V1nter111"}]
dependencies = []
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Operating System :: OS Independent"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "build>=1,<2", "ruff>=0.11,<1"]

[project.scripts]
agent-sentinel = "agent_sentinel.__main__:main"

[project.urls]
Repository = "https://github.com/V1nter111/agent-sentinel"
Issues = "https://github.com/V1nter111/agent-sentinel/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100
